global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "simulator"
    static_configs:
      - targets: ["simulator:8000"]
    metrics_path: /metrics

  - job_name: "inference"
    static_configs:
      - targets: ["inference:8002"]
    metrics_path: /metrics

  - job_name: "benchmark"
    static_configs:
      - targets: ["benchmark:8002"]
    metrics_path: /metrics

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
    metrics_path: /metrics

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # vLLM exposes OpenAI-compatible metrics on /metrics (prometheus format)
  - job_name: "vllm"
    static_configs:
      - targets: ["inference:8001"]
    metrics_path: /metrics

  # DCGM GPU exporter — on EKS, scrape via kubernetes_sd_configs
  - job_name: "dcgm"
    static_configs:
      - targets: ["dcgm-exporter:9400"]
    metrics_path: /metrics
